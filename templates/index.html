<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie & Entertainment Assistant</title>
  <style>
    :root {
      --bg: #08090d;
      --panel: rgba(20, 22, 31, 0.86);
      --panel-2: rgba(31, 34, 46, 0.9);
      --text: #f7f7fb;
      --muted: #9ea4b5;
      --accent: #ff3d81;
      --accent-2: #7c5cff;
      --border: rgba(255,255,255,.09);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(124,92,255,.22), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(255,61,129,.18), transparent 32%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .app {
      width: min(960px, 100%);
      height: min(820px, calc(100vh - 36px));
      min-height: 620px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--panel);
      backdrop-filter: blur(24px);
      box-shadow: 0 30px 90px rgba(0,0,0,.45);
    }

    header {
      padding: 22px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 24px;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      box-shadow: 0 12px 30px rgba(255,61,129,.2);
    }

    h1 { margin: 0; font-size: 18px; }
    .status { margin-top: 4px; color: var(--muted); font-size: 13px; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 26px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 78%;
      padding: 14px 17px;
      border-radius: 20px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .bot {
      align-self: flex-start;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
    }

    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      border-bottom-right-radius: 6px;
    }

    .composer {
      padding: 18px;
      border-top: 1px solid var(--border);
    }

    form {
      display: flex;
      gap: 10px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: rgba(255,255,255,.035);
    }

    input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      padding: 12px;
      font-size: 15px;
    }

    input::placeholder { color: #73798a; }

    button {
      border: 0;
      border-radius: 15px;
      padding: 0 20px;
      color: white;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
    }

    button:disabled { opacity: .55; cursor: not-allowed; }

    @media (max-width: 600px) {
      body { padding: 0; }
      .app { height: 100vh; min-height: 100vh; border-radius: 0; }
      .message { max-width: 88%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="logo">🎬</div>
      <div>
        <h1>Movie & Entertainment Assistant</h1>
        <div class="status">Ask me about movies, shows, actors, genres and entertainment.</div>
      </div>
    </header>

    <section id="messages" aria-live="polite">
      <div class="message bot">
        Hi! 🎬 I'm your Movie & Entertainment Assistant. Ask me anything about movies, TV shows, actors, directors, genres, awards, or entertainment.
      </div>
    </section>

    <div class="composer">
      <form id="chatForm">
        <input id="messageInput" autocomplete="off"
               placeholder="Ask about a movie or entertainment..." required>
        <button id="sendButton" type="submit">Send</button>
      </form>
    </div>
  </main>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const messages = document.getElementById("messages");
    const sendButton = document.getElementById("sendButton");

    function addMessage(text, role) {
      const el = document.createElement("div");
      el.className = `message ${role}`;
      el.textContent = text;
      messages.appendChild(el);
      messages.scrollTop = messages.scrollHeight;
      return el;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      input.focus();
      sendButton.disabled = true;

      const thinking = addMessage("Thinking…", "bot");

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        thinking.textContent = data.reply || data.error || "Something went wrong.";
      } catch {
        thinking.textContent = "Unable to connect to the chatbot right now.";
      } finally {
        sendButton.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
